name: CI

on:
  pull_request:
    branches: [desenvolvimento, main]
  push:
    branches: [desenvolvimento, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nutrify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nutrify_test?schema=public
      JWT_SECRET: ci-jwt-secret-com-pelo-menos-32-caracteres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      # Não bloqueia o PR enquanto o código legado tem erros de lint/format.
      # Quando o time zerar os erros, remova o continue-on-error.
      - name: Lint (sem --fix)
        run: npx eslint "{src,test}/**/*.ts"
        continue-on-error: true
