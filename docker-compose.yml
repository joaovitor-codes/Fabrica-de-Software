
services:
  db:
    image: postgres:15-alpine
    container_name: nutrify_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: nutrify_db
    ports:
      - "5454:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: